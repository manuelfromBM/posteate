services:
  - type: web
    name: posteate-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: "pip install uv && uv sync --frozen && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn core.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: posteate-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # TODO: reemplazar por el dominio real una vez creado el servicio en Render
      - key: ALLOWED_HOSTS
        value: posteate-backend.onrender.com
      # TODO: reemplazar por el dominio real del proyecto en Vercel
      - key: CORS_ALLOWED_ORIGINS
        value: https://posteate.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://posteate.vercel.app
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: SESSION_COOKIE_SECURE
        value: "True"
      # Vercel y Render son dominios distintos de verdad (cross-site):
      # sin SameSite=None la cookie de sesion no viaja en los fetch del frontend.
      - key: SESSION_COOKIE_SAMESITE
        value: "None"
      - key: CSRF_COOKIE_SECURE
        value: "True"
      - key: CSRF_COOKIE_SAMESITE
        value: "None"
      # Secretos: se cargan a mano en el dashboard de Render, nunca en este archivo.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: posteate-db
    plan: free
